# OAones common AI service. Keep this file ASCII-only.
ai.config_table=uf_oaones_generic_ai_config
ai.call_log_table=uf_oaones_generic_ai_call_log

# Comma-separated OA user IDs. E9 system administrator (id=1) is always allowed.
ai.admin.ids=
# Optional E9 role ID whose members can maintain the common AI configuration.
ai.admin.roleid=

# ismyopenai=0 uses modelurl/modelname from this file and locks provider fields.
# ismyopenai=1 allows editing API URL, model and request parameters in the page.
ismyopenai=1
modelurl=
modelname=deepseek-flash

ai.http.connect_timeout_ms=8000
ai.http.read_timeout_ms=45000
# Connection tests use a shorter timeout than normal business calls.
ai.http.test_timeout_ms=20000
